[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "api-logistik"
version = "0.1.0.dev0"
description = "FastAPI Oracle integration with Python-managed Global API Keys."
readme = "README.md"
requires-python = "==3.15.2"
dependencies = [
    "cryptography==50.0.2",
    "fastapi==0.162.0",
    "oracledb==26.0.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[project.scripts]
api-logistik = "api_logistik.main:run"
api-logistik-keys = "api_logistik.cli:main"
api-logistik-preflight = "api_logistik.preflight:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/api_logistik"]

[tool.uv]
required-version = "==0.13.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: opt-in Oracle sandbox tests requiring explicit permission"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.15"
strict = true
files = ["src/api_logistik"]

[tool.coverage.run]
branch = true
source = ["api_logistik"]

[tool.coverage.report]
show_missing = true
